
name: Deploy Flask App to EKS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to ECR
      run: |
        IMAGE_TAG=latest
        docker build -t ${{ steps.login-ecr.outputs.registry }}/flask-app:$IMAGE_TAG .
        docker push ${{ steps.login-ecr.outputs.registry }}/flask-app:$IMAGE_TAG

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3

    - name: Setup Helm
      uses: azure/setup-helm@v3

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region us-west-2 --name dev-eks

    # - name: Patch aws-auth ConfigMap
    #   run: |
    #     cat <<EOF | kubectl apply -f -
    #     apiVersion: v1
    #     kind: ConfigMap
    #     metadata:
    #       name: aws-auth
    #       namespace: kube-system
    #     data:
    #       mapUsers: |
    #         - userarn: arn:aws:iam::144317819575:user/lavanya
    #           username: lavanya
    #           groups:
    #             - system:masters
    #     EOF

    - name: Verify Cluster Access
      run: |
        kubectl get nodes

    - name: Deploy Flask App
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml

    - name: Install ALB Ingress Controller
      run: |
        helm repo add eks https://aws.github.io/eks-charts
        helm repo update
        helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller           --set clusterName=dev-eks           --set serviceAccount.create=false           --set serviceAccount.name=aws-load-balancer-controller           -n kube-system

    - name: Install Prometheus and Grafana
      run: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo update
        helm upgrade --install prometheus prometheus-community/prometheus -n monitoring --create-namespace
        helm upgrade --install grafana grafana/grafana -n monitoring
